<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        const saved = localStorage.getItem('research.theme');
        const theme = saved === 'light' || saved === 'dark' ? saved : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch { /* The application still works when browser storage is disabled. */ }
    </script>
    <title>Demand Sensing Intelligence Platform</title>
    <meta
      name="description"
      content="Agentic AI, RAG and knowledge graph platform that senses external market demand and ranks internal research coverage gaps."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
